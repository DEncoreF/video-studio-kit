<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>風格與參考庫</title>
<style>
  @font-face { font-family: 'Noto Sans TC'; src: url('/fonts/NotoSansTC-VF.ttf'); font-weight: 100 900; }

  :root { --ink: #16171d; --muted: #6b6b73; --line: #e4e1da; --bg: #f6f4ef; --card: #ffffff; --accent: #725ff7; }

  .cand.sel { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
  .cand .media { aspect-ratio: 16 / 9; background: #111; }
  .cand .media > * { width: 100%; height: 100%; object-fit: cover; display: block; }
  .strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; background: #111; }
  .strip img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; cursor: zoom-in; }
  footer .wrap { flex-direction: column; align-items: stretch; }
  footer .row { display: flex; align-items: center; gap: 12px; }
  .custom summary { cursor: pointer; font-size: 13px; opacity: .8; }
  .cgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 14px; padding: 10px 0 4px; }
  .cgrid label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; opacity: .9; }
  .cgrid label.wide { grid-column: span 2; }
  .cgrid input:not([type=range]) { border: 0; border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 13px; }
  .cgrid output { font-weight: 700; }
  /* previews animate only on screen, and never while paused */
  .tile, .tile * { animation-play-state: paused !important; }
  .tile.live, .tile.live * { animation-play-state: running !important; }
  body.paused .tile, body.paused .tile * { animation-play-state: paused !important; }
  .tabs { flex-wrap: wrap; }
  .btn.add { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; white-space: nowrap; }
  .fx { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
  .fx.sel { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
  .fx .media { aspect-ratio: 16 / 9; background: #16171d; position: relative; overflow: hidden; display: grid; place-items: center; color: #fff9; font-size: 13px; }
  .fx .media img, .fx .media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .fx .media iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
  .fx .media video { opacity: 0; transition: opacity .2s; } .fx .media.playing video { opacity: 1; }
  .fx .desc { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .fx code, .ref code, .site code { background: #f0eee8; border-radius: 4px; padding: 0 5px; font-size: 12.5px; }
  .badge.ok { background: #e3f5ea; color: #1d7a45; } .badge.partial { background: #fff1d6; color: #8a5a00; } .badge.latin-only { background: #fde8e8; color: #a12a2a; }
  .badge.user { background: #ece9ff; color: #4b3cc4; }
  .kv { font-size: 13.5px; line-height: 1.55; color: #3c3c44; margin: 0; } .kv b { color: var(--muted); font-weight: 500; margin-right: 6px; }
  .kv .spark { display: block; width: 100%; height: 22px; margin-top: 4px; fill: var(--muted); opacity: .55; } .kv .note { font-size: 12px; color: var(--muted); }
  .site { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }
  .site a { color: var(--ink); font-weight: 700; text-decoration: none; } .site a:hover { text-decoration: underline; }
  .site .host { color: var(--muted); font-size: 12.5px; }
  #addDlg details.more { display: block; } #addDlg.site details.more { display: none; }
  #addDlg .moregrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; padding-top: 10px; } #addDlg .moregrid label { display: flex; }
  #addDlg summary { cursor: pointer; font-size: 13px; color: var(--muted); }
  .seg { display: inline-flex; background: #ece9e2; border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: none; font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 999px; cursor: pointer; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px #0002; }
  .ex { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; }
  .ex.sel { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
  .ex .media { aspect-ratio: 16 / 9; background: #111; position: relative; overflow: hidden; display: grid; place-items: center; color: #fff9; font-size: 13px; }
  .ex .media img, .ex .media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .ex .media video { opacity: 0; transition: opacity .15s; } .ex .media.playing video { opacity: 1; }
  .ex .src { position: absolute; left: 8px; top: 8px; font-size: 11px; background: #000a; color: #fff; padding: 1px 7px; border-radius: 999px; }
  .ex .body { padding: 10px 12px 12px; gap: 6px; }

  .ex .note { font-size: 12.5px; line-height: 1.5; color: #3c3c44; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; } .ex .note b { color: var(--muted); font-weight: 500; margin-right: 5px; }
  .ex.liked { border-color: #1d7a45; box-shadow: 0 0 0 1px #1d7a45; } .ex.disliked { opacity: .62; }
  .btn.vd.like[aria-pressed="true"] { background: #e3f5ea; border-color: #1d7a45; color: #1d7a45; }
  .btn.vd.no[aria-pressed="true"] { background: #fde8e8; border-color: #a12a2a; color: #a12a2a; }
  .vnote { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; width: 100%; }
  #exDlg { width: min(1100px, 96vw); max-height: 94vh; background: var(--card); color: var(--ink); }
  #exDlg .exwrap { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(280px, 1fr); }
  #exDlg video, #exDlg .still { width: 100%; display: block; background: #000; max-height: 80vh; object-fit: contain; }
  #exDlg iframe { width: 100%; aspect-ratio: 16 / 9; border: 0; display: block; background: #000; }
  #exDlg .side { padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; overflow: auto; max-height: 80vh; }
  #exDlg .prompt { white-space: pre-wrap; background: #f6f4ef; border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.6; max-height: 260px; overflow: auto; }
  @media (max-width: 800px) { #exDlg .exwrap { grid-template-columns: 1fr; } }
  .vars { display: flex; flex-wrap: wrap; gap: 6px; }
  .vchip { border: 1px solid var(--line); background: #faf9f6; border-radius: 999px; padding: 4px 10px 4px 6px; font: inherit; font-size: 12.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .vchip:hover { border-color: var(--ink); } .vchip.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, #fff); } .vchip small { color: var(--muted); margin-left: 4px; }
  .rbody .def { grid-template-columns: 1fr 1fr; }
  .fam { margin: 0 0 44px; } .fam:last-child { margin-bottom: 0; }

  .famhead h2 { margin: 0; font-size: 24px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; } .famhead h2 i { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 21px; color: var(--muted); } .famhead h2 small { font-size: 13px; color: var(--muted); font-weight: 400; }
  .def { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px 22px; margin: 4px 0 0; }
  .def div { font-size: 13.5px; line-height: 1.55; color: #3c3c44; } .def b { color: var(--accent); font-weight: 700; margin-right: 6px; }
  .famfoot { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); align-items: center; }
  .famfoot code { background: #f0eee8; border-radius: 4px; padding: 0 5px; font-size: 12px; color: #3c3c44; }
  .sw { display: inline-flex; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); vertical-align: middle; } .sw i { width: 14px; height: 14px; display: block; }
  .pal { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
  .pal.sel { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }

  /* ---------- generic preview tiles: one motif per style, looping ---------- */
  .tile * { position: absolute; }
  .tile .word { z-index: 5; left: 7%; bottom: 10%; font-size: 9cqw; font-weight: 900; line-height: 1; white-space: nowrap; }
  .tile .word small { position: static; display: block; font-size: 3.4cqw; font-weight: 600; letter-spacing: .3em; margin-bottom: 1.2cqw; opacity: .8; }
  .f-serif { font-family: 'Noto Serif TC', serif; }
  .f-display { font-family: 'Instrument Serif', serif; font-weight: 400 !important; font-style: italic; }
  .f-mono { font-family: ui-monospace, Menlo, monospace; }
  .f-sans-light { font-weight: 300 !important; letter-spacing: .08em; }
  @keyframes rise { 0%, 8% { transform: translateY(120%); opacity: 0 } 22%, 85% { transform: none; opacity: 1 } 100% { transform: translateY(-20%); opacity: 0 } }
  .tile .word { animation: rise 4s var(--ease) infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }
  @keyframes drift { 0%,100% { transform: translate(0,0) } 50% { transform: translate(var(--dx, 20px), var(--dy, -12px)) } }
  @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.12) } }
  @keyframes slide { 0%,15% { transform: translateX(-120%) } 35%,80% { transform: none } 100% { transform: translateX(120%) } }
  @keyframes drop { 0%,10% { transform: translateY(-160%) } 30%,85% { transform: none } 100% { transform: translateY(160%) } }
  @keyframes draw { from { stroke-dashoffset: var(--len, 600) } 60%, to { stroke-dashoffset: 0 } }
  @keyframes morph { 0%,100% { border-radius: 42% 58% 61% 39% / 47% 38% 62% 53% } 50% { border-radius: 62% 38% 35% 65% / 58% 61% 39% 42% } }
  @keyframes floor { to { background-position: 0 40px } }
  @keyframes flicker { 0%,19%,21%,63%,65%,100% { opacity: 1 } 20%,64% { opacity: .35 } }
  @keyframes squash { 0%,100% { transform: translateY(0) scale(1,1) } 40% { transform: translateY(-40%) scale(.92,1.08) } 55% { transform: translateY(0) scale(1.15,.85) } 70% { transform: translateY(-8%) scale(.97,1.03) } }
  @keyframes march { to { transform: translateX(-50%) } }
  @keyframes tick { 0%,100% { transform: rotate(-2deg) } 50% { transform: rotate(2deg) } }
  @keyframes eq { 0%,100% { transform: scaleY(.15) } 50% { transform: scaleY(1) } }
  @keyframes swap3 { 0%,28% { opacity: 1; transform: none } 33%,100% { opacity: 0; transform: translateY(-40%) } }

<main class="wrap"><div id="view"></div></main>
<footer id="bar"><div class="wrap">
  <details class="custom"><summary>調整需求（選填）</summary>

      <label>長度<input id="cLength" placeholder="例：30 秒、9:16" /></label>
      <label>色彩<input id="cColours" placeholder="例：沿用品牌色、更暖一點" /></label>

      <label>創意幅度 <output id="creativityOut"></output><input type="range" id="creativity" min="0" max="100" step="50" value="50" /></label>

    </div>
  </details>
  <div class="row"><b id="count"></b><div class="picked" id="picked"></div>
  <textarea id="note" placeholder="補充，例如：A 的質感＋B 的字體"></textarea>
  <button class="send" id="send">送出選擇</button></div>
</div></footer>

<dialog id="zoomer"><img id="zoom" alt="" /></dialog>
<dialog id="exDlg"><div class="exwrap"><div class="player"></div><div class="side"></div></div></dialog>

  <h2>加入收藏</h2>

  <label class="wide">網址<input name="url" type="url" placeholder="Raivcoo、Prompt Motion、X、Vimeo… 的作品網址" /></label>

  <details class="wide more" data-for="work" style="grid-column:1/-1"><summary>更多（可借用什麼、配方、效果、出處）</summary><div class="moregrid">

  <label data-for="work">風格方向<select name="direction"></select></label>
  <label data-for="work">採用<select name="used"><option value="maybe">待定</option><option value="yes">已採用</option><option value="no">未採用</option></select></label>

  <label data-for="work">屬於哪支影片<select name="video"></select></label>
  <label data-for="work">出處網站<select name="source_site"></select></label>
  </div></details>
  <label data-for="site">分類<input name="category" list="catList" placeholder="例：文字效果" /></label>
  <label class="wide">標籤（逗號分隔）<input name="tags" placeholder="例：科技感, 字體動態" /></label>

  <div class="row2"><button type="button" class="btn" id="addCancel">取消</button><button type="submit" class="send">記錄</button></div>
</form></dialog>

const loadLib = () => state.lib ? Promise.resolve(state.lib) : fetch("/library.json").then((r) => r.json()).then((l) => { state.lib = l; if (state.tab === "styles") renderFilters(); return l; });

// which serves only paths that are logged references.
const mediaUrl = (u) => (u && u.startsWith("/") && !u.startsWith("/inbox/") ? (u.includes("/inbox/") ? `/inbox/${u.split("/").pop()}` : `/local?p=${encodeURIComponent(u)}`) : u);

function loopAt(v, at) {
  if (!at?.length) return;
  let i = 0; const go = () => { v.currentTime = at[i][0]; };
  if (v.readyState >= 1) go(); else v.addEventListener("loadedmetadata", go, { once: true });
  v.addEventListener("timeupdate", () => { const [a, b] = at[i]; if (v.currentTime >= b || v.currentTime < a - 0.5) { i = (i + 1) % at.length; go(); } });
}
function exMedia(m, label, at) {
  const box = h("div", "media");
  const poster = m?.poster || m?.image, yt = ytId(m?.video);
  const clip = yt ? null : mediaUrl(at?.length ? m?.video : m?.preview || m?.video); // the moments are timed on the full video
  let v = null, looping = false;
  const mk = (preload) => { v = Object.assign(h("video"), { src: clip, muted: true, loop: !at?.length, playsInline: true, preload }); box.append(v); return v; };
  if (poster) box.append(Object.assign(h("img"), { src: mediaUrl(poster), alt: "", loading: "lazy" }));
  else if (clip) { // no poster: the still is the end of the first moment (the effect done), or the first frame
    mk("metadata").classList.add("still");
    v.addEventListener("loadedmetadata", () => { if (!looping) v.currentTime = at?.length ? Math.max(at[0][0], at[0][1] - 0.3) : 0.1; }, { once: true });
  } else box.textContent = yt ? "YouTube：點開播放" : "沒有預覽";
  if (clip) {
    box.onmouseenter = () => { if (!v) mk("auto"); if (!looping) { looping = true; loopAt(v, at); } box.classList.add("playing"); v.play().catch(() => {}); };
    box.onmouseleave = () => { box.classList.remove("playing"); v?.pause(); };
  }
  if (label) box.append(h("span", "src", {}, esc(label)));
  if (at?.length) box.append(h("span", "at", {}, atLabel(at)));
  return box;
}

// Registry previews: the catalog's own (poster, video on hover) when its links answer, else the 4
// local frames from scripts/registry-previews.mjs (middle frame, flipping through all on hover).
function mediaFor(item, fallback) {
  const m = h("div", "media"), p = item?.preview, local = item?.local;
  if (p?.video) {
    const v = Object.assign(h("video"), { muted: true, loop: true, playsInline: true, preload: "metadata", poster: p.poster || local?.[1] || "" });
    v.src = p.poster || local ? p.video : `${p.video}#t=0.6`; // no poster: let the video show a frame of itself
    if (!p.poster && !local) v.style.opacity = 1;
    m.append(v);
    m.onmouseenter = () => { m.classList.add("playing"); v.play().catch(() => {}); };
    m.onmouseleave = () => { m.classList.remove("playing"); v.pause(); };
    if (p.poster || local) m.prepend(Object.assign(h("img"), { src: p.poster || local[1], alt: "", loading: "lazy" }));
  } else if (p?.poster) m.append(Object.assign(h("img"), { src: p.poster, alt: "", loading: "lazy" }));
  else if (local) {
    const img = Object.assign(h("img"), { src: local[1] ?? local[0], alt: "", loading: "lazy" }); m.append(img);
    let timer = 0, k = 0;
    m.onmouseenter = () => { local.forEach((u) => (new Image().src = u)); timer = setInterval(() => { k = (k + 1) % local.length; img.src = local[k]; }, 420); };
    m.onmouseleave = () => { clearInterval(timer); img.src = local[1] ?? local[0]; };
    m.append(h("span", "", { position: "absolute", right: "8px", bottom: "6px", fontSize: "11px", color: "#fff", background: "#0008", padding: "1px 6px", borderRadius: "4px" }, "本機預覽"));
  } else m.textContent = item?.previewNote ?? fallback;
  return m;
}

// One line from the measured path: which way, how much, and when it moves fastest (t10–t90 drifts with small jitter, the peak does not).
function camMeasure(m) {
  const parts = [];
  if (Math.abs(m.zoom - 1) >= 0.08) parts.push(m.zoom > 1 ? `推近 ×${m.zoom.toFixed(2)}` : `拉遠 ×${(1 / m.zoom).toFixed(2)}`);
  if (Math.abs(m.pan_pct) >= 8) parts.push(`${m.pan_pct > 0 ? "往右" : "往左"} ${Math.abs(Math.round(m.pan_pct))}% 畫面寬`);
  if (Math.abs(m.tilt_pct) >= 8) parts.push(`${m.tilt_pct > 0 ? "往下" : "往上"} ${Math.abs(Math.round(m.tilt_pct))}% 畫面高`);
  if (Math.abs(m.roll_deg) >= 8) parts.push(`旋轉 ${Math.round(m.roll_deg)}°`);
  if (!parts.length) return "幾乎不動";
  return `${parts.join("・")}；最快在 ${Math.round(m.peak_at * 100)}%（${m.seconds} 秒的預覽）`;
}
const spark = (p) => { const mx = Math.max(...p, 0.01); return `<svg class="spark" viewBox="0 0 100 24" preserveAspectRatio="none" aria-label="速度曲線">${p.map((v, i) => `<rect x="${i * 10 + 1}" y="${24 - (v / mx) * 22}" width="8" height="${(v / mx) * 22 + 0.5}" rx="1"/>`).join("")}</svg>`; };

  const lone = h("button", "chip sm", {}, "顯示沒有連線的"); lone.setAttribute("aria-pressed", G.lonely); lone.onclick = () => { G.lonely = !G.lonely; renderView(); }; bar.append(lone);
  const fitB = h("button", "chip sm", {}, "置中"); fitB.onclick = () => G.fit?.(); bar.append(fitB);
  const q = h("input"); q.type = "search"; q.placeholder = "找節點…"; q.value = G.q; q.oninput = () => { G.q = q.value.trim().toLowerCase(); G.wake?.(); }; bar.append(q);
  const wrap = h("div", "graphwrap"), cv = h("canvas"); cv.id = "graph";
  const panel = h("aside", "gpanel", {}, `<p class="hint" style="margin:0">點一個節點看它連到哪些東西。拖曳節點移動、拖曳空白處平移、滾輪縮放。連線只來自紀錄裡寫下的欄位：參考的方向、出處、用到的效果與標籤，文字效果對應的元件，配方提到的效果。</p>`);
  wrap.append(cv, panel); v.append(bar, wrap);
  loadGraph().then((g) => state.tab === "graph" && drawGraph(cv, panel, g));
}

function drawGraph(cv, panel, g) {
  let nodes = g.nodes.filter((n) => G.on[n.type]);
  const ids = new Set(nodes.map((n) => n.id));
  const edges = g.edges.filter((e) => ids.has(e.a) && ids.has(e.b));
  const deg = {}; edges.forEach((e) => { deg[e.a] = (deg[e.a] || 0) + 1; deg[e.b] = (deg[e.b] || 0) + 1; });
  if (!G.lonely) nodes = nodes.filter((n) => deg[n.id]);
  const W = () => cv.clientWidth, H = () => cv.clientHeight;
  // Stable start: a seeded spiral per type, so the picture is the same on every visit.
  const types = Object.keys(GT);
  const N = nodes.map((n, i) => { const k = types.indexOf(n.type), a = i * 2.39996, r = 40 + 9 * Math.sqrt(i); return { ...n, x: Math.cos(a + k) * r, y: Math.sin(a + k) * r, vx: 0, vy: 0, d: deg[n.id] || 0 }; });
  const by = new Map(N.map((n) => [n.id, n]));
  const E = edges.map((e) => ({ ...e, s: by.get(e.a), t: by.get(e.b) })).filter((e) => e.s && e.t);
  const nb = new Map(N.map((n) => [n.id, []])); E.forEach((e) => { nb.get(e.s.id).push([e.t, e.why]); nb.get(e.t.id).push([e.s, e.why]); });
  const view = { x: 0, y: 0, k: 1 }; let alpha = 1, hover = null, drag = null, pan = null;
  const dpr = window.devicePixelRatio || 1, ctx = cv.getContext("2d");
  const size = () => { cv.width = W() * dpr; cv.height = H() * dpr; };
  G.resize = () => { size(); G.wake(); }; window.addEventListener("resize", G.resize); size();
  const R = (n) => (4 + Math.min(10, Math.sqrt(n.d) * 2.2)) / view.k; // constant size on screen at any zoom
  function tick() {
    for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++) {
      const a = N[i], b = N[j]; let dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy || 1; if (d2 > 90000) continue;
      const f = (900 / d2) * alpha; dx *= f; dy *= f; a.vx -= dx; a.vy -= dy; b.vx += dx; b.vy += dy;
    }
    for (const e of E) { const dx = e.t.x - e.s.x, dy = e.t.y - e.s.y, d = Math.hypot(dx, dy) || 1, f = ((d - 46) / d) * 0.06 * alpha; e.s.vx += dx * f; e.s.vy += dy * f; e.t.vx -= dx * f; e.t.vy -= dy * f; }
    for (const n of N) { if (n === drag) continue; n.vx -= n.x * 0.012 * alpha; n.vy -= n.y * 0.012 * alpha; n.x += (n.vx *= 0.6); n.y += (n.vy *= 0.6); }
    alpha *= 0.985;
  }
  const lit = () => { const s = G.sel && by.get(G.sel); return s ? new Set([s.id, ...nb.get(s.id).map(([n]) => n.id)]) : null; };
  function paint() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W(), H());
    ctx.translate(W() / 2 + view.x, H() / 2 + view.y); ctx.scale(view.k, view.k);
    const L = lit(), q = G.q, hit = (n) => q && n.label.toLowerCase().includes(q);
    ctx.lineWidth = 1 / view.k;
    for (const e of E) { const on = L && L.has(e.s.id) && L.has(e.t.id) && (e.s.id === G.sel || e.t.id === G.sel); ctx.strokeStyle = on ? "#725ff7aa" : L ? "#0000000d" : "#00000021"; ctx.beginPath(); ctx.moveTo(e.s.x, e.s.y); ctx.lineTo(e.t.x, e.t.y); ctx.stroke(); }
    for (const n of N) {
      const dim = (L && !L.has(n.id)) || (q && !hit(n));
      ctx.globalAlpha = dim ? 0.18 : 1; ctx.fillStyle = GT[n.type][1]; ctx.beginPath(); ctx.arc(n.x, n.y, R(n), 0, 7); ctx.fill();
      if (n.id === G.sel || hit(n)) { ctx.lineWidth = 2.5 / view.k; ctx.strokeStyle = "#725ff7"; ctx.stroke(); ctx.lineWidth = 1 / view.k; }
    }
    ctx.globalAlpha = 1; ctx.font = `${12 / view.k}px 'Noto Sans TC', sans-serif`; ctx.textBaseline = "middle";
    for (const n of N) {
      const show = n === hover || (L ? L.has(n.id) : (q ? hit(n) : n.d >= 5 || view.k > 1.6));
      if (!show) continue;
      const tx = n.x + R(n) + 4 / view.k; ctx.lineWidth = 3 / view.k; ctx.strokeStyle = "#fff"; ctx.strokeText(n.label, tx, n.y); ctx.fillStyle = "#16171d"; ctx.fillText(n.label, tx, n.y);
    }
  }
  function loop() { if (alpha > 0.02 || drag) tick(); paint(); G.raf = alpha > 0.02 || drag ? requestAnimationFrame(loop) : 0; }
  G.wake = (heat = 0) => { alpha = Math.max(alpha, heat); if (!G.raf) G.raf = requestAnimationFrame(loop); };
  const at = (ev) => { const r = cv.getBoundingClientRect(); return [(ev.clientX - r.left - W() / 2 - view.x) / view.k, (ev.clientY - r.top - H() / 2 - view.y) / view.k]; };
  const pick = (ev) => { const [x, y] = at(ev); let best = null, bd = 1e9; for (const n of N) { const d = Math.hypot(n.x - x, n.y - y); if (d < R(n) + 5 / view.k && d < bd) { best = n; bd = d; } } return best; };
  cv.onpointerdown = (ev) => { cv.setPointerCapture(ev.pointerId); const n = pick(ev); if (n) { drag = n; drag.moved = false; } else pan = [ev.clientX - view.x, ev.clientY - view.y]; cv.classList.add("dragging"); };
  cv.onpointermove = (ev) => {
    if (drag) { const [x, y] = at(ev); drag.x = x; drag.y = y; drag.vx = drag.vy = 0; drag.moved = true; G.wake(0.3); return; }
    if (pan) { view.x = ev.clientX - pan[0]; view.y = ev.clientY - pan[1]; G.wake(); return; }
    const n = pick(ev); if (n !== hover) { hover = n; cv.style.cursor = n ? "pointer" : ""; G.wake(); }
  };
  cv.onpointerup = (ev) => { cv.classList.remove("dragging"); if (drag && !drag.moved) select(drag.id); else if (pan && !drag && Math.abs(ev.clientX - view.x - pan[0]) < 2) {} drag = null; pan = null; };
  cv.onwheel = (ev) => { ev.preventDefault(); const k = Math.min(4, Math.max(0.25, view.k * Math.exp(-ev.deltaY * 0.0015))); const r = cv.getBoundingClientRect(), mx = ev.clientX - r.left - W() / 2, my = ev.clientY - r.top - H() / 2; view.x = mx - ((mx - view.x) * k) / view.k; view.y = my - ((my - view.y) * k) / view.k; view.k = k; G.wake(); };
  cv.ondblclick = () => { select(null); };
  function select(id) {
    G.sel = id; G.wake();
    const n = id && by.get(id);
    if (!n) { panel.innerHTML = `<p class="hint" style="margin:0">${N.length} 個節點、${E.length} 條連線。點一個節點看它連到哪些東西。</p>`; return; }
    const tabOf = { family: "styles", style: "styles", effect: "effects", registry: "registry", ref: "refs", site: "sites" }[n.type];
    panel.innerHTML = `<div><span class="dot" style="background:${GT[n.type][1]}"></span><small>${GT[n.type][0]}</small></div><h3>${esc(n.label)}</h3>`;
    if (/^https?:/.test(n.key ?? "")) panel.append(h("div", "", {}, link(n.key, "開啟網址 ↗")));
    const groups = {}; for (const [m, why] of nb.get(n.id)) (groups[why] ??= []).push(m);
    for (const [why, ms] of Object.entries(groups)) {
      panel.append(h("b", "", {}, `${esc(why)}（${ms.length}）`));
      const ul = h("ul"); ms.sort((a, b) => b.d - a.d).forEach((m) => { const li = h("li"), b = h("button", "", {}, `<span class="dot" style="background:${GT[m.type][1]}"></span>${esc(m.label)}<small>${GT[m.type][0]}</small>`); b.onclick = () => select(m.id); li.append(b); ul.append(li); }); panel.append(ul);
    }
    if (tabOf) { const go = h("button", "btn", { marginTop: "6px", alignSelf: "flex-start" }, `到「${GT[n.type][0]}」分頁查看`); go.onclick = () => { state.tab = tabOf; if (n.type === "family") { state.family = n.key; state.q = ""; } else state.q = n.type === "ref" || n.type === "site" ? n.label : n.key; render(); }; panel.append(go); }
  }
  select(G.sel && by.has(G.sel) ? G.sel : null);
  // Settle before the first frame (so it does not fly in), then fit everything in the canvas.
  function fit() {
    if (!N.length) return;
    const xs = N.map((n) => n.x), ys = N.map((n) => n.y), [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
    view.k = Math.min(2.2, (W() - 60) / (x1 - x0 + 120), (H() - 60) / (y1 - y0 + 40));
    view.x = -((x0 + x1) / 2) * view.k; view.y = -((y0 + y1) / 2) * view.k; G.wake();
  }
  G.fit = fit;
  for (let i = 0; i < 300; i++) tick();
  fit();
}

// ---------- 新增參考 ----------
function openAdd() {
  const d = $("addDlg"), f = $("addForm"); f.reset(); $("addErr").textContent = ""; setKind("work");
  f.direction.innerHTML = `<option value="">（不指定）</option>` + state.data.catalog.styles.map((s) => `<option value="${esc(s.id)}">${esc(s.zh)}・${esc(s.id)}</option>`).join("");
  f.video.innerHTML = `<option value="">整個資源庫（不屬於某支片）</option>` + state.data.videos.map((n) => `<option${n === state.data.video ? " selected" : ""}>${esc(n)}</option>`).join("");
  f.source_site.innerHTML = `<option value="">（不指定）</option>` + state.data.sites.map((s) => `<option value="${esc(s.url)}">${esc(s.name)}</option>`).join("");
  $("catList").innerHTML = [...new Set(state.data.sites.flatMap((s) => s.categories))].map((c) => `<option value="${esc(c)}">`).join("");
  $("effectList").innerHTML = state.data.effects.map((e) => `<option value="${esc(e.zh)}">${esc(e.en)}</option>`).join("") + (state.registry?.items ?? []).map((i) => `<option value="${esc(i.name)}">${esc(i.title)}</option>`).join("");
  d.showModal(); f.url.focus();
}
function setKind(k) { $("addDlg").classList.toggle("site", k === "site"); document.querySelectorAll("#addDlg .kind .chip").forEach((b) => b.setAttribute("aria-pressed", b.dataset.kind === k)); $("addDlg").dataset.kind = k; }
document.querySelectorAll("#addDlg .kind .chip").forEach((b) => (b.onclick = () => setKind(b.dataset.kind)));
$("addRef").onclick = () => openAdd();
$("addCancel").onclick = () => $("addDlg").close();
$("addForm").onsubmit = async (ev) => {
  ev.preventDefault();
  const f = $("addForm"), kind = $("addDlg").dataset.kind, val = (n) => f[n].value.trim();
  const img = f.image.files?.[0];
  if (!val("url") && !(kind === "work" && img)) { $("addErr").textContent = kind === "site" ? "請填網址" : "請填網址或上傳一張圖片"; return; }
  if (kind === "site" && !val("title")) { $("addErr").textContent = "參考網站請填名稱"; return; }
  let file = "";
  if (kind === "work" && img && !val("url")) {
    $("addErr").textContent = "上傳圖片中…";
    const data = await new Promise((done) => { const r = new FileReader(); r.onload = () => done(r.result); r.readAsDataURL(img); });
    const up = await (await fetch("/upload", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name: img.name, data }) })).json();
    if (!up.file) { $("addErr").textContent = `沒有上傳：${up.error}`; return; }
    file = up.file;
  }
  const body = kind === "site"
    ? { kind: "site", url: val("url"), title: val("title"), why: val("siteWhy"), category: val("category"), tags: val("tags") }
    : { url: val("url") || file, file, title: val("title") || (file ? img.name.replace(/\.[^.]+$/, "") : ""), why: val("why"), learn: val("learn"), direction: val("direction"), used: val("used"), effects: val("effects"), video: val("video"), source_site: val("source_site"), tags: val("tags") };
  $("addErr").textContent = file ? "記錄中…" : "檢查連結、讀取網站資料中…";
  try {
    const r = await fetch("/refs", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    const out = await r.json();
    if (!r.ok) { $("addErr").textContent = `沒有記錄：${out.error ?? r.status}`; return; }
    $("addDlg").close();
    await reload(); state.graph = null;
    state.tab = kind === "site" ? "sites" : "styles"; state.src = "mine"; state.q = ""; render();
    toast(out.warning ? `已記錄（${out.warning}）` : `已記錄：${out.entry.title}`);
  } catch { $("addErr").textContent = "連不到 gallery 伺服器，確認它還在跑"; }
};
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2400); }

const reload = () => fetch("/data.json").then((r) => r.json()).then((d) => {
  state.data = d;
  $("nStyles").textContent = ""; $("nPalettes").textContent = d.palettes.length; $("nEffects").textContent = d.effects.length; $("nCameras").textContent = d.cameras.length; $("nSites").textContent = d.sites.length;
  $("ctx").textContent = d.video ? `影片：${d.video}` : "全部專案";
  return d;
});
reload().then((d) => {
  if (d.video) { $("boardTab").hidden = false; $("nBoard").textContent = d.candidates.length; if (d.candidates.length) state.tab = "board"; }
  render();
  loadRegistry().then(() => state.tab === "effects" && renderView()); // effect cards show registry previews once loaded
});
</script>
